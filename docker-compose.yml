name: rate-limiter

services:

  redis:
    image: redis:7-alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    container_name: rl-postgres
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter"]
      interval: 2s
      timeout: 2s
      retries: 15

  service-a:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        MODULE: service-a
    container_name: rl-service-a
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  service-b:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        MODULE: service-b
    container_name: rl-service-b
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  api-gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        MODULE: api-gateway
    container_name: rl-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      SERVICE_A_HOSTPORT: service-a:8081
      SERVICE_B_HOSTPORT: service-b:8082
      RATELIMITER_ENABLED: "true"
      RATELIMITER_FAIL_OPEN: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      service-a:
        condition: service_healthy
      service-b:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rl-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
